<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HABI STUDIO CODING .ZIP</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg: #f5f5f5; --bg2: #e0e0e0; --bg3: #ffffff;
      --card-bg: rgba(255,255,255,0.95); --text: #1a1a1a;
      --accent: #6c3fd4; --accent2: #3b6eff; --danger: #e53935;
      --border: rgba(0,0,0,0.15); --input-bg: rgba(0,0,0,0.05);
      --header-color: #1a1a1a;
    }
    .dark-theme {
      --bg: #0f0c29; --bg2: #302b63; --bg3: #24243e;
      --card-bg: rgba(20,20,40,0.85); --text: #e0e0e0;
      --accent: #7c4dff; --accent2: #448aff; --danger: #e53935;
      --border: rgba(255,255,255,0.15); --input-bg: rgba(0,0,0,0.4);
      --header-color: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, var(--bg), var(--bg2), var(--bg3));
      background-size: 400% 400%; animation: gradientMove 15s ease infinite;
      color: var(--text); min-height: 100vh; padding: 1rem;
      display: flex; flex-direction: column; align-items: center;
      position: relative; overflow-x: hidden;
    }
    @keyframes gradientMove { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
    .particles { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:hidden; }
    .particle { position:absolute; background:rgba(128,128,255,0.15); border-radius:50%; animation:float linear infinite; }
    @keyframes float { 0%{transform:translateY(100vh);opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{transform:translateY(-10vh);opacity:0} }
    .container {
      width:100%; max-width:580px; background:var(--card-bg); backdrop-filter:blur(20px);
      border-radius:24px; padding:1.5rem; margin:1rem 0;
      box-shadow:0 20px 40px rgba(0,0,0,0.15); border:1px solid var(--border);
      position:relative; z-index:1;
    }
    .logo-area { text-align: center; margin-bottom: 0.5rem; }
    .logo-svg { width: 220px; height: 70px; animation: logoPulse 2s infinite; }
    @keyframes logoPulse { 0%{transform:scale(1)} 50%{transform:scale(1.03)} 100%{transform:scale(1)} }
    .tab-buttons { display:flex; gap:0.4rem; margin:1rem 0; flex-wrap:wrap; }
    .tab-btn {
      flex:1; min-width:55px; padding:0.7rem 0.3rem; border:none;
      background:rgba(128,128,255,0.15); color:var(--text); border-radius:12px;
      font-weight:bold; cursor:pointer; font-size:0.75rem;
    }
    .tab-btn.active { background:linear-gradient(135deg,#7c4dff,#536dfe); color:white; }
    .tab-content { display:none; }
    .tab-content.active { display:block; }
    label { display:block; margin-top:0.8rem; font-weight:bold; color:var(--accent); font-size:0.9rem; }
    input, textarea, select {
      width:100%; padding:0.7rem; margin-top:0.2rem; border-radius:12px;
      border:1px solid var(--border); background:var(--input-bg); color:var(--text);
      font-size:0.95rem;
    }
    input:focus, textarea:focus, select:focus { border-color:#7c4dff; outline:none; }
    textarea { font-family:'Courier New',monospace; resize:vertical; min-height:120px; }
    button.primary {
      width:100%; padding:0.8rem; background:linear-gradient(135deg,#7c4dff,#448aff);
      border:none; color:white; font-weight:bold; font-size:0.95rem;
      border-radius:16px; margin-top:0.8rem; cursor:pointer;
    }
    .danger-btn { background:#e53935 !important; }
    .inline-btn {
      padding:0.4rem 0.8rem; background:#536dfe; color:white;
      border:none; border-radius:8px; cursor:pointer; font-size:0.8rem; margin:0.2rem;
    }
    .modal-overlay {
      position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.7); display:none; justify-content:center;
      align-items:center; z-index:1000;
    }
    .modal {
      background:var(--card-bg); padding:1.5rem; border-radius:20px;
      max-width:400px; width:90%; border:1px solid var(--border);
      text-align:center; color:var(--text);
    }
    .modal h3 { color:#c084fc; margin-bottom:0.8rem; }
    .modal button { margin:0.3rem; padding:0.7rem 1.5rem; border-radius:12px; border:none; font-weight:bold; cursor:pointer; }
    .btn-cancel { background:rgba(128,128,128,0.2); color:var(--text); }
    .btn-confirm { background:#7c4dff; color:white; }
    .toast {
      position:fixed; bottom:2rem; left:50%; transform:translateX(-50%);
      padding:0.8rem 1.5rem; border-radius:30px; background:#333; color:white;
      z-index:2000; display:none; font-size:0.9rem; animation:toastIn 0.3s;
    }
    .toast.success { background:#2e7d32; }
    .toast.error { background:#c62828; }
    .toast.info { background:#1565c0; }
    @keyframes toastIn { from{bottom:0;opacity:0} to{bottom:2rem;opacity:1} }
    .search-results {
      position:absolute; background:var(--card-bg); border:1px solid var(--border);
      border-radius:8px; max-height:200px; overflow-y:auto; z-index:50;
      width:100%; display:none; margin-top:0.2rem;
    }
    .search-results div {
      padding:0.5rem; cursor:pointer; border-bottom:1px solid rgba(128,128,128,0.1);
      font-size:0.85rem; color:var(--text);
    }
    .search-results div:hover { background:rgba(124,77,255,0.2); }
    .file-browser { background:rgba(128,128,128,0.1); border-radius:12px; padding:0.8rem; max-height:300px; overflow-y:auto; margin:0.5rem 0; font-size:0.85rem; }
    .repo-list-item { display:flex; align-items:center; gap:0.3rem; padding:0.3rem 0.1rem; border-bottom:1px solid rgba(128,128,128,0.1); }
    .protected-badge { background:#e53935; padding:0.1rem 0.3rem; border-radius:6px; font-size:0.65rem; margin-left:0.2rem; color:white; }
    footer { text-align:center; margin-top:1.5rem; padding:1rem; color:var(--text); font-size:0.85rem; border-top:1px solid var(--border); width:100%; opacity:0.7; }
    .switch { position:relative; display:inline-block; width:40px; height:22px; }
    .switch input { opacity:0; width:0; height:0; }
    .slider { position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background-color:#ccc; transition:.3s; border-radius:22px; }
    .slider:before { position:absolute; content:""; height:16px; width:16px; left:3px; bottom:3px; background-color:white; transition:.3s; border-radius:50%; }
    input:checked+.slider { background-color:#7c4dff; }
    input:checked+.slider:before { transform:translateX(18px); }
    .theme-toggle {
      position:fixed; top:1rem; right:1rem; z-index:500; background:var(--card-bg);
      border:1px solid var(--border); border-radius:50%; width:36px; height:36px;
      display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:1.1rem;
    }
    .login-btn { background:#24292e; color:white; border:none; padding:0.6rem 1.2rem; border-radius:12px; font-weight:bold; cursor:pointer; display:inline-flex; align-items:center; gap:0.4rem; }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  <div class="theme-toggle" onclick="toggleTheme()">🌓</div>

  <div class="container">
    <div class="logo-area">
      <svg class="logo-svg" viewBox="0 0 240 70" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff4e50"/>
            <stop offset="50%" stop-color="#f9d423"/>
            <stop offset="100%" stop-color="#7c4dff"/>
          </linearGradient>
          <filter id="glow">
            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
            <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <rect x="10" y="15" width="50" height="40" rx="8" fill="#e53935" stroke="white" stroke-width="2" filter="url(#glow)"/>
        <rect x="15" y="20" width="40" height="30" rx="5" fill="white"/>
        <text x="35" y="41" text-anchor="middle" font-size="20" font-weight="900" fill="#e53935">HS</text>
        <text x="75" y="45" font-size="22" font-weight="900" fill="url(#lg)" filter="url(#glow)" letter-spacing="1">HABI STUDIO CODING</text>
      </svg>
    </div>

    <div id="loginArea" style="text-align:center;margin:0.5rem 0;">
      <button class="login-btn" onclick="openLoginModal()">🔑 Login GitHub</button>
      <div id="userInfo" style="display:none;align-items:center;gap:0.4rem;background:rgba(128,128,255,0.1);padding:0.4rem 0.8rem;border-radius:12px;">
        <span id="userDisplayName"></span>
        <button onclick="openAccountManager()" class="inline-btn">👥</button>
        <button onclick="logoutUser()" class="inline-btn" style="background:#e53935;">Logout</button>
      </div>
    </div>

    <div class="tab-buttons" id="tabNav" style="display:none;">
      <button class="tab-btn active" onclick="switchTab('single')">Single</button>
      <button class="tab-btn" onclick="switchTab('zip')">ZIP</button>
      <button class="tab-btn" onclick="switchTab('editor')">Editor</button>
      <button class="tab-btn" onclick="switchTab('files')">Files</button>
      <button class="tab-btn" onclick="switchTab('rename')">Rename</button>
      <button class="tab-btn" onclick="switchTab('create-repo')">+Repo</button>
      <button class="tab-btn" onclick="switchTab('list-repo')">Daftar</button>
    </div>

    <!-- Tab Single -->
    <div id="tab-single" class="tab-content active">
      <div style="display:flex;gap:0.3rem;">
        <input type="text" id="singleSearch" placeholder="Cari file atau folder..." autocomplete="off" style="flex:1;">
        <button onclick="searchInSingle()" class="inline-btn">Cari</button>
      </div>
      <div class="search-results" id="singleResults"></div>
      <label>Tempel Kode</label>
      <textarea id="singleCode" placeholder="// Kode muncul setelah pilih file..."></textarea>
      <div style="display:flex;gap:0.3rem;margin-top:0.3rem;">
        <button onclick="refreshSingleTab()" class="inline-btn">Refresh</button>
        <button onclick="clearSingleCode()" class="inline-btn" style="background:#e53935;">Hapus Kode</button>
        <button onclick="searchInSingleCode()" class="inline-btn">Cari Kode</button>
      </div>
      <button class="primary" onclick="deploySingle()">Upload File</button>
      <div id="singleStatus" style="margin-top:0.3rem;font-size:0.8rem;"></div>
    </div>

    <!-- Tab ZIP -->
    <div id="tab-zip" class="tab-content">
      <label>Pilih file ZIP</label>
      <input type="file" id="zipFile" accept=".zip">
      <label style="display:flex;align-items:center;gap:0.5rem;margin-top:0.5rem;"><input type="checkbox" id="stripRoot" checked> Hapus folder root</label>
      <button class="primary" onclick="deployZip()">Upload ZIP & Deploy</button>
      <div id="zipProgress" style="display:none;width:100%;background:rgba(128,128,128,0.2);border-radius:10px;height:8px;margin-top:0.5rem;"><div id="zipFill" style="height:100%;background:#7c4dff;border-radius:10px;width:0%;transition:width 0.2s;"></div></div>
    </div>

    <!-- Tab Editor -->
    <div id="tab-editor" class="tab-content">
      <div style="display:flex;gap:0.3rem;">
        <input type="text" id="editorSearch" placeholder="Cari file atau folder..." autocomplete="off" style="flex:1;">
        <button onclick="searchInEditor()" class="inline-btn">Cari</button>
      </div>
      <div class="search-results" id="editorResults"></div>
      <label>Isi File</label>
      <textarea id="editorCode" placeholder="// Pilih file untuk diedit..."></textarea>
      <div style="display:flex;gap:0.3rem;margin-top:0.3rem;">
        <button onclick="searchInEditorCode()" class="inline-btn">Cari Kode</button>
      </div>
      <button class="primary" onclick="saveAndUploadEdit()">Simpan & Upload</button>
      <div id="editorStatus" style="margin-top:0.3rem;font-size:0.8rem;"></div>
    </div>

    <!-- Tab Files -->
    <div id="tab-files" class="tab-content">
      <div class="file-browser" id="fileBrowser">Klik Muat Struktur.</div>
      <button onclick="loadRepoTree()" class="inline-btn">Muat Struktur</button>
      <div id="manageStatus" style="margin-top:0.5rem;font-size:0.8rem;"></div>
      <button class="primary" onclick="deleteAllFiles()">Hapus Semua File</button>
      <button class="primary danger-btn" onclick="deleteFolderInteractive()">Hapus Folder</button>
      <button class="primary danger-btn" onclick="deleteRepoInteractive()">Hapus Repository</button>
    </div>

    <!-- Tab Rename -->
    <div id="tab-rename" class="tab-content">
      <div style="display:flex;gap:0.3rem;">
        <input type="text" id="renameSearch" placeholder="Cari file atau folder..." autocomplete="off" style="flex:1;">
        <button onclick="searchInRename()" class="inline-btn">Cari</button>
      </div>
      <div class="search-results" id="renameResults"></div>
      <label>Nama Baru</label>
      <input type="text" id="renameNewPath" placeholder="path baru">
      <button class="primary" onclick="executeRename()">Rename</button>
    </div>

    <!-- Tab Buat Repo -->
    <div id="tab-create-repo" class="tab-content">
      <label>Nama repositori</label>
      <input type="text" id="newRepoName" placeholder="nama-repo-baru">
      <label>Visibilitas</label>
      <select id="newRepoVisibility"><option value="public">Public</option><option value="private">Private</option></select>
      <label style="display:flex;align-items:center;gap:0.5rem;margin-top:0.5rem;"><input type="checkbox" id="newRepoReadme" checked> Tambahkan README</label>
      <button class="primary" onclick="createRepo()">Buat Repositori</button>
      <div id="createRepoResult" style="margin-top:0.5rem;"></div>
    </div>

    <!-- Tab Daftar Repo -->
    <div id="tab-list-repo" class="tab-content">
      <div style="display:flex;gap:0.5rem;margin-bottom:0.3rem;"><button onclick="refreshRepoList()" class="inline-btn">Refresh</button><span id="repoCount">0 repo</span></div>
      <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.3rem;"><input type="checkbox" id="selectAllRepos" onchange="toggleAllRepos()"><span>Pilih Semua</span></div>
      <div id="repoListContainer" style="max-height:300px;overflow-y:auto;background:rgba(128,128,128,0.1);border-radius:8px;padding:0.3rem;"></div>
      <button class="primary danger-btn" onclick="deleteSelectedRepos()">Hapus Terpilih</button>
      <div style="margin-top:0.8rem;"><strong>Riwayat Penghapusan</strong><div id="deleteHistoryContainer" style="max-height:120px;overflow-y:auto;background:rgba(128,128,128,0.1);padding:0.5rem;border-radius:8px;font-size:0.8rem;">Belum ada.</div></div>
    </div>
  </div>

  <div style="text-align:center;margin-top:0.5rem;"><span>Mode Anti-Lag</span><label class="switch"><input type="checkbox" id="antiLagToggle" checked onchange="toggleAntiLag()"><span class="slider"></span></label></div>
  <footer>Powered by <strong>HABI STUDIO AI</strong> — Melampaui Batas Kreativitas</footer>

  <!-- Modal Login -->
  <div id="loginModal" class="modal-overlay"><div class="modal" style="text-align:left;">
    <h3>Login GitHub</h3><label>Username</label><input type="text" id="loginUsername"><label>Repository</label><input type="text" id="loginRepo"><label>Token <a href="https://github.com/settings/tokens/new?scopes=repo,delete_repo&description=HABI+STUDIO" target="_blank">(buat token)</a></label><input type="password" id="loginToken">
    <button class="primary" onclick="loginAndSave()">Login & Simpan</button>
    <button onclick="closeLoginModal()" class="btn-cancel" style="width:100%;margin-top:0.3rem;">Tutup</button>
  </div></div>

  <!-- Modal Manajemen Akun -->
  <div id="accountModal" class="modal-overlay"><div class="modal" style="text-align:left;">
    <h3>Manajemen Akun</h3><div id="accountList" style="max-height:250px;overflow-y:auto;"></div>
    <button onclick="closeAccountModal()" class="btn-cancel" style="width:100%;margin-top:0.5rem;">Tutup</button>
  </div></div>

  <!-- Modal Edit Akun -->
  <div id="editAccountModal" class="modal-overlay"><div class="modal" style="text-align:left;">
    <h3>Edit Profil</h3><label>Username</label><input type="text" id="editUsername"><label>Repository</label><input type="text" id="editRepo"><label>Token</label><input type="password" id="editToken">
    <div style="display:flex;justify-content:flex-end;gap:0.5rem;margin-top:1rem;"><button onclick="closeEditAccountModal()" class="btn-cancel">Batal</button><button onclick="saveEditAccount()" class="btn-confirm">Simpan</button></div>
  </div></div>

  <!-- Toast & Confirm Modal -->
  <div id="toast" class="toast"></div>
  <div id="confirmModal" class="modal-overlay"><div class="modal"><h3>HABI STUDIO NOTE</h3><p id="confirmMessage"></p><button class="btn-confirm" id="confirmOk">Ya</button><button class="btn-cancel" id="confirmCancel">Batal</button></div></div>

  <script>
    // STATE
    const SK='hs_profiles',UK='hs_user',HK='hs_history',AK='hs_antilag',TK='hs_theme';
    let repoTree=[],selDelFolder='',selSingle='',selEditor='',selRename='';

    function $id(id){return document.getElementById(id);}
    function toast(m,t){let e=$id('toast');e.textContent=m;e.className='toast '+(t||'');e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',3000);}
    function confirm(m,cb){$id('confirmMessage').innerHTML=m;$id('confirmModal').style.display='flex';$id('confirmOk').onclick=()=>{$id('confirmModal').style.display='none';cb();};$id('confirmCancel').onclick=()=>$id('confirmModal').style.display='none';}
    function setStatus(m,t){let d=$id('globalStatus');if(!m){d.textContent='';return;}d.textContent=m;d.style.background=t==='success'?'#e6ffec':t==='error'?'#ffebe9':'transparent';}

    function getCreds(){let u=JSON.parse(localStorage.getItem(UK)||'null');return u?{username:u.username,repo:u.repo,token:u.token}:{username:'',repo:'',token:''};}
    function toB64(s){return btoa(Array.from(new TextEncoder().encode(s),b=>String.fromCharCode(b)).join(''));}
    async function ghReq(url,opts){let r=await fetch(url,opts);if(!r.ok){let m=`HTTP ${r.status}`;try{let e=await r.json();m=e.message||m;}catch(_){}throw new Error(m);}return r;}
    async function fetchTree(o,r,t){let res=await ghReq(`https://api.github.com/repos/${o}/${r}/git/trees/main?recursive=1`,{headers:{'Authorization':`token ${t}`}});return(await res.json()).tree||[];}
    async function ghUpload(o,r,p,c,t){let url=`https://api.github.com/repos/${o}/${r}/contents/${p}`;let h={'Authorization':`token ${t}`};let sha=null;try{let gr=await fetch(url,{headers:h});if(gr.ok)sha=(await gr.json()).sha;else if(gr.status!==404)throw new Error(`Cek ${p}: ${gr.status}`);}catch(_){}let body={message:`Update ${p}`,content:toB64(c),branch:'main'};if(sha)body.sha=sha;let pr=await fetch(url,{method:'PUT',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!pr.ok)throw new Error((await pr.json().catch(()=>({}))).message||'Gagal');}
    async function ghGet(o,r,p,t){return(await ghReq(`https://api.github.com/repos/${o}/${r}/contents/${p}`,{headers:{'Authorization':`token ${t}`}})).json();}
    async function ghDelete(o,r,p,s,t){await ghReq(`https://api.github.com/repos/${o}/${r}/contents/${p}`,{method:'DELETE',headers:{'Authorization':`token ${t}`,'Content-Type':'application/json'},body:JSON.stringify({message:`Delete ${p}`,sha:s,branch:'main'})});}

    // THEME
    function loadTheme(){if(localStorage.getItem(TK)==='dark')document.body.classList.add('dark-theme');}
    function toggleTheme(){document.body.classList.toggle('dark-theme');localStorage.setItem(TK,document.body.classList.contains('dark-theme')?'dark':'light');toast('Tema diubah','info');}
    // ANTI-LAG
    function initAntiLag(){let on=JSON.parse(localStorage.getItem(AK)||'true');$id('antiLagToggle').checked=on;applyAntiLag(on);}
    function toggleAntiLag(){let on=$id('antiLagToggle').checked;localStorage.setItem(AK,JSON.stringify(on));applyAntiLag(on);}
    function applyAntiLag(on){let p=$id('particles');if(p)p.style.display=on?'none':'block';}

    // LOGIN
    function checkLogin(){let u=JSON.parse(localStorage.getItem(UK)||'null');if(u)showLoggedIn(u);else showLoggedOut();}
    function showLoggedIn(u){$id('loginArea').querySelector('.login-btn').style.display='none';$id('userInfo').style.display='flex';$id('userDisplayName').textContent=u.username;$id('tabNav').style.display='flex';switchTab('single');loadRepoTree();}
    function showLoggedOut(){$id('loginArea').querySelector('.login-btn').style.display='inline-flex';$id('userInfo').style.display='none';$id('tabNav').style.display='none';document.querySelectorAll('.tab-content').forEach(c=>c.style.display='none');}
    function openLoginModal(){$id('loginModal').style.display='flex';}
    function closeLoginModal(){$id('loginModal').style.display='none';}
    async function loginAndSave(){
      let un=$id('loginUsername').value.trim(),rp=$id('loginRepo').value.trim(),tk=$id('loginToken').value.trim();
      if(!un||!rp||!tk)return toast('Isi semua','error');
      try{
        let r=await fetch('https://api.github.com/user',{headers:{'Authorization':`token ${tk}`}});
        if(!r.ok)throw new Error('Token tidak valid');
        let d=await r.json();let u={username:d.login,repo:rp,token:tk};
        localStorage.setItem(UK,JSON.stringify(u));
        let p=JSON.parse(localStorage.getItem(SK)||'[]');if(!p.find(x=>x.token===tk)){p.push({name:d.login,username:d.login,repo:rp,token:tk});localStorage.setItem(SK,JSON.stringify(p));}
        closeLoginModal();showLoggedIn(u);toast('Login berhasil','success');
      }catch(e){toast('Gagal: '+e.message,'error');}
    }
    function logoutUser(){confirm('Logout?',()=>{localStorage.removeItem(UK);showLoggedOut();toast('Logout','info');});}

    // TABS
    function switchTab(t){
      ['single','zip','editor','files','rename','create-repo','list-repo'].forEach((n,i)=>{
        document.querySelectorAll('.tab-btn')[i].classList.toggle('active',n===t);
        let c=$id('tab-'+n);if(c){c.classList.toggle('active',n===t);c.style.display=n===t?'block':'none';}
      });
      if(t==='list-repo')refreshRepoList();
    }

    // REPO TREE
    async function loadRepoTree(){
      let c=getCreds();if(!c.username)return;
      try{repoTree=await fetchTree(c.username,c.repo,c.token);renderFileBrowser();toast('Struktur dimuat','success');}catch(e){toast('Gagal: '+e.message,'error');}
    }
    function renderFileBrowser(){
      let c=$id('fileBrowser');if(!repoTree.length){c.innerHTML='Kosong.';return;}
      let folders=repoTree.filter(i=>i.type==='tree'),files=repoTree.filter(i=>i.type==='blob');
      let h='<div><strong>Folder:</strong></div>';
      folders.forEach(f=>h+=`<div>📁 ${f.path} <button onclick="selDelFolder='${f.path}';$id('manageStatus').textContent='Folder: ${f.path}'">Hapus</button></div>`);
      h+='<div><strong>File:</strong></div>';
      files.forEach(f=>h+=`<div>📄 ${f.path} <button onclick="downloadFile('${f.path}')">Unduh</button><button onclick="deleteFile('${f.path}')">Hapus</button></div>`);
      c.innerHTML=h;
    }

    // SINGLE TAB
    function searchInSingle(){
      let q=$id('singleSearch').value.trim();if(q.length<2)return toast('Min 2 karakter','error');
      let results=repoTree.filter(i=>i.path.toLowerCase().includes(q.toLowerCase()));
      let c=$id('singleResults');c.innerHTML='';if(!results.length){c.innerHTML='<div>Tidak ditemukan</div>';c.style.display='block';return;}
      results.forEach(i=>{let d=document.createElement('div');d.textContent=(i.type==='tree'?'📁':'📄')+' '+i.path;d.onclick=()=>selectSingle(i.path,i.type);c.appendChild(d);});
      c.style.display='block';
    }
    async function selectSingle(path,type){
      $id('singleSearch').value=path;$id('singleResults').style.display='none';
      if(type==='blob'){selSingle=path;let c=getCreds();try{let d=await ghGet(c.username,c.repo,path,c.token);$id('singleCode').value=atob(d.content);toast('File dimuat','success');}catch(e){toast('Gagal','error');}}
      else{selSingle='';toast('Pilih file, bukan folder','info');}
    }
    function deploySingle(){
      if(!selSingle)return toast('Pilih file dulu','error');let code=$id('singleCode').value;if(!code.trim())return toast('Kosong','error');
      confirm(`Update ${selSingle}?`,async()=>{let c=getCreds();try{await ghUpload(c.username,c.repo,selSingle,code,c.token);toast('Upload sukses','success');loadRepoTree();}catch(e){toast('Gagal: '+e.message,'error');}});
    }
    function searchInSingleCode(){let q=prompt('Cari dalam kode:');if(!q)return;let t=$id('singleCode');let i=t.value.indexOf(q);if(i===-1)return toast('Tidak ditemukan','error');t.setSelectionRange(i,i+q.length);t.focus();}
    function refreshSingleTab(){loadRepoTree();toast('Direfresh','info');}
    function clearSingleCode(){$id('singleCode').value='';toast('Kode dihapus','info');}

    // EDITOR TAB
    function searchInEditor(){
      let q=$id('editorSearch').value.trim();if(q.length<2)return toast('Min 2 karakter','error');
      let results=repoTree.filter(i=>i.path.toLowerCase().includes(q.toLowerCase()));
      let c=$id('editorResults');c.innerHTML='';if(!results.length){c.innerHTML='<div>Tidak ditemukan</div>';c.style.display='block';return;}
      results.forEach(i=>{let d=document.createElement('div');d.textContent=(i.type==='tree'?'📁':'📄')+' '+i.path;d.onclick=()=>selectEditor(i.path,i.type);c.appendChild(d);});
      c.style.display='block';
    }
    async function selectEditor(path,type){
      $id('editorSearch').value=path;$id('editorResults').style.display='none';
      if(type==='blob'){selEditor=path;let c=getCreds();try{let d=await ghGet(c.username,c.repo,path,c.token);$id('editorCode').value=atob(d.content);toast('File dimuat','success');}catch(e){toast('Gagal','error');}}
      else{selEditor='';toast('Pilih file','info');}
    }
    function saveAndUploadEdit(){
      if(!selEditor)return toast('Pilih file','error');let code=$id('editorCode').value;if(!code.trim())return toast('Kosong','error');
      confirm(`Update ${selEditor}?`,async()=>{let c=getCreds();try{await ghUpload(c.username,c.repo,selEditor,code,c.token);toast('Upload sukses','success');loadRepoTree();}catch(e){toast('Gagal: '+e.message,'error');}});
    }
    function searchInEditorCode(){let q=prompt('Cari dalam kode editor:');if(!q)return;let t=$id('editorCode');let i=t.value.indexOf(q);if(i===-1)return toast('Tidak ditemukan','error');t.setSelectionRange(i,i+q.length);t.focus();}

    // RENAME TAB
    function searchInRename(){
      let q=$id('renameSearch').value.trim();if(q.length<2)return toast('Min 2 karakter','error');
      let results=repoTree.filter(i=>i.path.toLowerCase().includes(q.toLowerCase()));
      let c=$id('renameResults');c.innerHTML='';if(!results.length){c.innerHTML='<div>Tidak ditemukan</div>';c.style.display='block';return;}
      results.forEach(i=>{let d=document.createElement('div');d.textContent=(i.type==='tree'?'📁':'📄')+' '+i.path;d.onclick=()=>selectRename(i.path);c.appendChild(d);});
      c.style.display='block';
    }
    function selectRename(path){selRename=path;$id('renameSearch').value=path;$id('renameResults').style.display='none';$id('renameNewPath').value=path;}
    function executeRename(){
      let np=$id('renameNewPath').value.trim();if(!selRename||!np||selRename===np)return toast('Tidak valid','error');
      confirm(`Rename ${selRename} ke ${np}?`,async()=>{
        let c=getCreds();
        try{
          let isFile=repoTree.some(i=>i.type==='blob'&&i.path===selRename);
          if(isFile){let d=await ghGet(c.username,c.repo,selRename,c.token);await ghUpload(c.username,c.repo,np,atob(d.content),c.token);await ghDelete(c.username,c.repo,selRename,d.sha,c.token);}
          else{let tree=await fetchTree(c.username,c.repo,c.token);let files=tree.filter(i=>i.type==='blob'&&i.path.startsWith(selRename+'/'));for(let f of files){let d=await ghGet(c.username,c.repo,f.path,c.token);await ghUpload(c.username,c.repo,f.path.replace(selRename,np),atob(d.content),c.token);await ghDelete(c.username,c.repo,f.path,d.sha,c.token);}}
          toast('Rename sukses','success');loadRepoTree();
        }catch(e){toast('Gagal: '+e.message,'error');}
      });
    }

    // FILES TAB
    async function downloadFile(p){let c=getCreds();try{let d=await ghGet(c.username,c.repo,p,c.token);let b=new Blob([atob(d.content)],{type:'text/plain'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=p.split('/').pop();a.click();}catch(e){toast('Gagal','error');}}
    async function deleteFile(p){let c=getCreds();confirm(`Hapus ${p}?`,async()=>{try{let d=await ghGet(c.username,c.repo,p,c.token);await ghDelete(c.username,c.repo,p,d.sha,c.token);toast('Dihapus','success');loadRepoTree();}catch(e){toast('Gagal: '+e.message,'error');}});}
    async function deleteFolderInteractive(){if(!selDelFolder)return toast('Pilih folder dulu','error');confirm(`Hapus folder ${selDelFolder}?`,async()=>{let c=getCreds();try{let tree=await fetchTree(c.username,c.repo,c.token);let files=tree.filter(i=>i.type==='blob'&&i.path.startsWith(selDelFolder+'/'));for(let f of files)try{await ghDelete(c.username,c.repo,f.path,f.sha,c.token);}catch(_){}toast('Folder dihapus','success');loadRepoTree();}catch(e){toast('Gagal: '+e.message,'error');}});}
    async function deleteAllFiles(){let c=getCreds();confirm(`Hapus SEMUA file?`,async()=>{try{let tree=await fetchTree(c.username,c.repo,c.token);let files=tree.filter(i=>i.type==='blob');let d=0;let s=$id('manageStatus');for(let i=0;i<files.length;i+=5){let batch=files.slice(i,i+5);await Promise.all(batch.map(async f=>{try{await ghDelete(c.username,c.repo,f.path,f.sha,c.token);d++;s.textContent=`${d}/${files.length}`;}catch(_){}}));}toast(`${d} file dihapus`,'success');loadRepoTree();}catch(e){toast('Gagal: '+e.message,'error');}});}
    async function deleteRepoInteractive(){let c=getCreds();confirm(`HAPUS REPO ${c.username}/${c.repo}?`,async()=>{try{let r=await fetch(`https://api.github.com/repos/${c.username}/${c.repo}`,{method:'DELETE',headers:{'Authorization':`token ${c.token}`}});if(r.ok||r.status===204){toast('Repo dihapus','success');localStorage.removeItem(UK);showLoggedOut();}else throw new Error('Gagal');}catch(e){toast('Gagal: '+e.message,'error');}});}

    // ZIP
    async function deployZip(){let c=getCreds();let fi=$id('zipFile');if(!fi.files.length)return toast('Pilih ZIP','error');let bar=$id('zipProgress'),fill=$id('zipFill');bar.style.display='block';fill.style.width='0%';try{let zip=await JSZip.loadAsync(fi.files[0]);let files=[];zip.forEach((p,f)=>{if(!f.dir)files.push({path:p,cp:f.async('string')});});if($id('stripRoot').checked){let roots=new Set(files.map(f=>f.path.split('/')[0]));if(roots.size===1&&files.every(f=>f.path.includes('/'))){let rf=[...roots][0];files=files.map(f=>({...f,path:f.path.replace(rf+'/','')}));}}let done=0;for(let f of files){let ct=await f.cp;await ghUpload(c.username,c.repo,f.path,ct,c.token);done++;fill.style.width=(done/files.length*100)+'%';}toast('ZIP terupload','success');loadRepoTree();}catch(e){toast('Gagal: '+e.message,'error');}setTimeout(()=>bar.style.display='none',3000);}

    // CREATE REPO
    async function createRepo(){let c=getCreds();let nm=$id('newRepoName').value.trim();if(!nm)return toast('Nama repo?','error');try{let r=await fetch('https://api.github.com/user/repos',{method:'POST',headers:{'Authorization':`token ${c.token}`,'Content-Type':'application/json'},body:JSON.stringify({name:nm,private:$id('newRepoVisibility').value==='private',auto_init:$id('newRepoReadme').checked})});if(!r.ok)throw new Error((await r.json()).message);let d=await r.json();$id('createRepoResult').innerHTML=`<input value="${d.html_url}" readonly onclick="this.select();navigator.clipboard.writeText(this.value);toast('URL disalin','success')">`;toast('Repo dibuat','success');}catch(e){toast('Gagal: '+e.message,'error');}}

    // DAFTAR REPO
    async function refreshRepoList(){let c=getCreds();if(!c.username)return;try{let repos=[],page=1;while(true){let r=await fetch(`https://api.github.com/user/repos?per_page=100&page=${page}`,{headers:{'Authorization':`token ${c.token}`}});if(!r.ok)throw new Error('Gagal');let d=await r.json();if(!d.length)break;repos=repos.concat(d);if(d.length<100)break;page++;}renderRepoList(repos);$id('selectAllRepos').checked=false;$id('repoCount').textContent=repos.length+' repo';}catch(e){$id('repoListContainer').innerHTML='Error: '+e.message;}}
    function renderRepoList(repos){let c=$id('repoListContainer');if(!repos.length){c.innerHTML='Tidak ada';return;}let h='';repos.forEach(r=>{let prot=r.name==='deploy-tool';h+=`<div class="repo-list-item">${prot?`<span>${r.name} <span class="protected-badge">DILINDUNGI</span></span>`:`<input type="checkbox" class="repo-checkbox" value="${r.name}" data-owner="${r.owner.login}"><span>${r.name}</span>`}</div>`;});c.innerHTML=h;renderHistory();}
    function toggleAllRepos(){let s=$id('selectAllRepos').checked;document.querySelectorAll('.repo-checkbox').forEach(c=>c.checked=s);}
    async function deleteSelectedRepos(){let cbs=document.querySelectorAll('.repo-checkbox:checked');if(!cbs.length)return toast('Pilih repo','error');let c=getCreds();let list=Array.from(cbs).map(c=>({name:c.value,owner:c.dataset.owner})).filter(r=>r.name!=='deploy-tool');if(!list.length)return toast('deploy-tool dilindungi','error');confirm(`Hapus ${list.map(r=>r.name).join(', ')}?`,async()=>{let ok=0;for(let r of list){try{let res=await fetch(`https://api.github.com/repos/${r.owner}/${r.name}`,{method:'DELETE',headers:{'Authorization':`token ${c.token}`}});if(res.ok||res.status===204){addHistory(r.name);ok++;}}catch(_){}}toast(`${ok} repo dihapus`,'success');refreshRepoList();});}
    function getHistory(){return JSON.parse(localStorage.getItem(HK)||'[]');}
    function addHistory(n){let h=getHistory();h.push({name:n,time:new Date().toISOString()});localStorage.setItem(HK,JSON.stringify(h));}
    function renderHistory(){let c=$id('deleteHistoryContainer'),h=getHistory();c.innerHTML=h.length?h.slice().reverse().map(i=>`<div>${i.name} <span style="opacity:0.5">${new Date(i.time).toLocaleString('id-ID')}</span></div>`).join(''):'Belum ada.';}

    // AKUN MANAGER
    function getProfiles(){return JSON.parse(localStorage.getItem(SK)||'[]');}
    function saveProfiles(p){localStorage.setItem(SK,JSON.stringify(p));}
    function openAccountManager(){let p=getProfiles(),c=$id('accountList');c.innerHTML=p.length?p.map((x,i)=>`<div style="display:flex;justify-content:space-between;padding:0.3rem;background:rgba(128,128,255,0.1);border-radius:8px;margin-bottom:0.2rem;"><div><strong>${x.name}</strong><br><small>${x.username}/${x.repo}</small></div><div><button onclick="switchAccount(${i})" class="inline-btn">Pilih</button><button onclick="editAccount(${i})" class="inline-btn">Edit</button><button onclick="delAccount(${i})" class="inline-btn" style="background:#e53935;">Hapus</button></div></div>`).join(''):'<p>Belum ada akun</p>';$id('accountModal').style.display='flex';}
    function closeAccountModal(){$id('accountModal').style.display='none';}
    function switchAccount(i){let p=getProfiles()[i];localStorage.setItem(UK,JSON.stringify({username:p.username,repo:p.repo,token:p.token}));closeAccountModal();showLoggedIn({username:p.username});toast('Akun beralih','success');}
    function delAccount(i){let p=getProfiles();p.splice(i,1);saveProfiles(p);openAccountManager();toast('Akun dihapus','info');}
    function editAccount(i){let p=getProfiles()[i];$id('editUsername').value=p.username;$id('editRepo').value=p.repo;$id('editToken').value=p.token;$id('editAccountModal').dataset.editIndex=i;$id('editAccountModal').style.display='flex';}
    function closeEditAccountModal(){$id('editAccountModal').style.display='none';}
    function saveEditAccount(){let i=$id('editAccountModal').dataset.editIndex;let p=getProfiles();if(i===undefined)return;p[i].username=$id('editUsername').value.trim();p[i].repo=$id('editRepo').value.trim();p[i].token=$id('editToken').value.trim();saveProfiles(p);closeEditAccountModal();openAccountManager();toast('Profil diperbarui','success');}

    function genParticles(){let c=$id('particles');for(let i=0;i<20;i++){let p=document.createElement('div');p.className='particle';let s=Math.random()*5+2;p.style.width=s+'px';p.style.height=s+'px';p.style.left=Math.random()*100+'%';p.style.animationDuration=(Math.random()*10+8)+'s';p.style.animationDelay=(Math.random()*6)+'s';c.appendChild(p);}}
    window.onload=()=>{loadTheme();genParticles();initAntiLag();checkLogin();};
  </script>
</body>
</html>
