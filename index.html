<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HABI STUDIO CODING .ZIP</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      background-size: 400% 400%;
      animation: gradientMove 15s ease infinite;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }
    .particles {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      animation: float linear infinite;
      opacity: 0.5;
    }
    @keyframes float {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .container {
      width: 100%; max-width: 550px;
      background: rgba(20,20,40,0.8); backdrop-filter: blur(20px);
      border-radius: 24px; padding: 1.5rem; margin: 1rem 0;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 60px rgba(100,100,255,0.2);
      border: 1px solid rgba(255,255,255,0.15);
      position: relative; z-index: 1;
    }
    .logo-text {
      font-size: 2.2rem; font-weight: 900;
      background: linear-gradient(135deg, #ff4e50, #f9d423, #00c6ff, #7c4dff);
      background-size: 300% 300%;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: logoGradient 3s ease infinite, logoGlow 1.5s ease-in-out infinite alternate;
      text-align: center; margin-bottom: 0.5rem;
    }
    @keyframes logoGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes logoGlow {
      from { filter: drop-shadow(0 0 5px #7c4dff); }
      to { filter: drop-shadow(0 0 20px #f9d423); }
    }
    .shortcut-card {
      display: flex; align-items: center; justify-content: center;
      gap: 0.5rem; background: rgba(255,255,255,0.05);
      padding: 0.6rem 1rem; border-radius: 16px;
      margin: 0.8rem 0; text-decoration: none;
      color: #fff; border: 1px solid rgba(255,255,255,0.15);
      transition: all 0.3s ease;
      animation: pulseGlow 2s infinite;
    }
    .shortcut-card:hover { background: rgba(124,77,255,0.2); box-shadow: 0 0 20px rgba(124,77,255,0.5); }
    .shortcut-card .icon { font-size: 1.8rem; animation: iconSpin 4s linear infinite; }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 5px rgba(124,77,255,0.3); }
      50% { box-shadow: 0 0 20px rgba(124,77,255,0.6); }
      100% { box-shadow: 0 0 5px rgba(124,77,255,0.3); }
    }
    @keyframes iconSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .tab-buttons { display: flex; gap: 0.4rem; margin: 1rem 0; flex-wrap: wrap; }
    .tab-btn {
      flex: 1; min-width: 55px; padding: 0.7rem 0.3rem;
      border: none; background: rgba(255,255,255,0.1);
      color: #ddd; border-radius: 12px; font-weight: bold;
      cursor: pointer; transition: all 0.3s; font-size: 0.75rem;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, #7c4dff, #536dfe);
      color: white; box-shadow: 0 4px 15px rgba(124,77,255,0.4);
    }
    .tab-content { display: none; animation: fadeIn 0.4s ease; }
    .tab-content.active { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    label { display: block; margin-top: 1rem; font-weight: bold; color: #c0c0ff; }
    input, textarea, select {
      width: 100%; padding: 0.8rem; margin-top: 0.3rem;
      border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.4); color: white; font-size: 1rem;
    }
    input:focus, textarea:focus, select:focus { border-color: #7c4dff; box-shadow: 0 0 8px #7c4dff; }
    textarea { font-family: 'Courier New', monospace; resize: vertical; }
    button.primary {
      width: 100%; padding: 0.9rem;
      background: linear-gradient(135deg, #7c4dff, #448aff);
      border: none; color: white; font-weight: bold; font-size: 1rem;
      border-radius: 16px; margin-top: 1rem; cursor: pointer;
      box-shadow: 0 4px 20px rgba(124,77,255,0.5);
      transition: transform 0.2s;
    }
    button.primary:active { transform: scale(0.97); }
    .danger-btn {
      background: #e53935 !important; border: none !important;
      box-shadow: 0 4px 15px rgba(229,57,53,0.5) !important;
    }
    .modal-overlay {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
      display: flex; justify-content: center; align-items: center;
      z-index: 1000;
    }
    .modal {
      background: linear-gradient(145deg, #1e1e2f, #2a2a40);
      padding: 2rem; border-radius: 20px;
      max-width: 400px; width: 90%; text-align: center;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 0 40px rgba(124,77,255,0.3);
    }
    .modal h3 { color: #c084fc; margin-bottom: 1rem; }
    .modal button { margin: 0.5rem; padding: 0.8rem 2rem; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; }
    .btn-cancel { background: rgba(255,255,255,0.1); color: white; }
    .btn-confirm { background: #7c4dff; color: white; }
    .file-browser {
      background: rgba(0,0,0,0.3); border-radius: 12px;
      padding: 0.8rem; margin: 0.5rem 0;
      max-height: 250px; overflow-y: auto;
    }
    .file-entry {
      display: flex; justify-content: space-between;
      align-items: center; padding: 0.4rem 0.3rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      font-size: 0.9rem;
    }
    .file-entry span { word-break: break-all; flex: 1; margin-right: 0.5rem; }
    .file-entry button { padding: 0.3rem 0.6rem; font-size: 0.8rem; margin-left: 0.3rem; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: white; border-radius: 6px; cursor: pointer; }
    footer {
      text-align: center; margin-top: 2rem; padding: 1rem;
      color: #8888aa; font-size: 0.9rem;
      border-top: 1px solid rgba(255,255,255,0.1); width: 100%;
    }
    .guide details {
      background: rgba(0,0,0,0.3); padding: 0.8rem; border-radius: 10px; margin-bottom: 0.8rem;
    }
    .guide summary { font-weight: bold; color: #b388ff; cursor: pointer; }
    select option { background: #1e1e2f; color: white; }
    .inline-btn {
      padding: 0.6rem 1rem;
      background: #536dfe;
      color: white; border: none; border-radius: 8px;
      cursor: pointer; font-size: 0.9rem;
    }
    .token-panel {
      background: rgba(0,0,0,0.3);
      padding: 0.5rem;
      border-radius: 12px;
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .token-panel input {
      flex: 1;
      padding: 0.4rem;
      font-size: 0.9rem;
    }
    .toast {
      position: fixed; bottom: 2rem; left: 50%;
      transform: translateX(-50%);
      padding: 1rem 2rem;
      border-radius: 30px;
      background: #333;
      color: white;
      z-index: 2000;
      animation: slideUp 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      text-align: center;
      max-width: 90%;
    }
    @keyframes slideUp {
      from { bottom: 0; opacity: 0; }
      to { bottom: 2rem; opacity: 1; }
    }
    .account-form input { margin-top: 0.3rem; }
    .result-box {
      background: rgba(0,0,0,0.3);
      padding: 1rem; border-radius: 12px; margin-top: 0.5rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .result-box input { flex: 1; background: transparent; border: none; color: white; padding: 0.5rem; }
    .result-box button { padding: 0.5rem 1rem; }
    /* Daftar Repo */
    .repo-list-header {
      display: flex; align-items: center; gap: 0.5rem;
      margin-bottom: 0.5rem; font-weight: bold;
    }
    .repo-list-item {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.4rem 0; border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .repo-list-item label { margin-top: 0; font-weight: normal; }
    .repo-list-item .repo-name {
      flex: 1;
      word-break: normal;           /* PERBAIKAN: tidak memenggal kata di tengah */
      overflow-wrap: break-word;    /* tetap bisa pindah baris jika terlalu panjang */
      margin-right: 0.5rem;
    }
    .protected-badge { background: #e53935; padding: 0.2rem 0.5rem; border-radius: 8px; font-size: 0.8rem; margin-left: 0.3rem; }
    .history-item {
      padding: 0.3rem 0; border-bottom: 1px solid rgba(255,255,255,0.03);
      font-size: 0.9rem; display: flex; justify-content: space-between;
    }
    /* Toggle switch */
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #7c4dff; }
    input:focus + .slider { box-shadow: 0 0 1px #7c4dff; }
    input:checked + .slider:before { transform: translateX(20px); }
  </style>
</head>
<body>
  <!-- ... (seluruh HTML sama seperti sebelumnya, tidak diubah) ... -->
  <!-- Hanya bagian CSS yang diubah, konten HTML tetap sama -->
  <!-- ... -->
</body>
</html>
