<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HABI STUDIO CODING</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    /* ========== GLOBAL ========== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0c29;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background 0.3s, color 0.3s;
    }
    body.light {
      background: #f5f5f5;
      color: #222;
    }
    .particles {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
    }
    .container {
      width: 100%; max-width: 550px;
      background: rgba(20,20,40,0.9);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 1.5rem;
      margin: 1rem 0;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      position: relative;
      z-index: 1;
    }
    body.light .container {
      background: rgba(255,255,255,0.9);
      color: #222;
    }

    /* ========== LOGO SVG ========== */
    .logo-svg {
      display: block;
      margin: 0 auto 0.5rem;
      width: 180px;
      animation: logoFloat 3s ease-in-out infinite;
    }
    @keyframes logoFloat {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* ========== TABS ========== */
    .tab-buttons { display: flex; gap: 0.3rem; margin: 1rem 0; flex-wrap: wrap; }
    .tab-btn {
      flex: 1; min-width: 55px; padding: 0.6rem 0.3rem;
      border: none; background: rgba(255,255,255,0.08);
      color: #ccc; border-radius: 12px; font-weight: bold;
      cursor: pointer; font-size: 0.75rem;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, #7c4dff, #536dfe);
      color: white;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ========== FORM ========== */
    input, textarea, select {
      width: 100%; padding: 0.8rem; margin-top: 0.3rem;
      border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.4); color: white; font-size: 1rem;
    }
    body.light input, body.light textarea, body.light select {
      background: rgba(0,0,0,0.05);
      color: #222;
      border-color: #ccc;
    }
    button.primary {
      width: 100%; padding: 0.9rem;
      background: linear-gradient(135deg, #7c4dff, #448aff);
      border: none; color: white; font-weight: bold;
      border-radius: 16px; margin-top: 0.8rem; cursor: pointer;
    }

    /* ========== MODAL ========== */
    .modal-overlay {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      display: flex; justify-content: center; align-items: center;
      z-index: 1000;
    }
    .modal {
      background: #1e1e2f;
      padding: 2rem; border-radius: 20px;
      max-width: 400px; width: 90%; text-align: center;
    }

    /* ========== REPO LIST ========== */
    .repo-list-item {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.4rem 0; border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .repo-name {
      cursor: pointer;
      flex: 1;
      user-select: none;
    }
    .repo-name:hover { color: #7c4dff; }

    /* ========== TOAST ========== */
    .toast {
      position: fixed; bottom: 2rem; left: 50%;
      transform: translateX(-50%);
      padding: 1rem 2rem; border-radius: 30px;
      background: #333; color: white;
      z-index: 2000;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { bottom: 0; opacity: 0; }
      to { bottom: 2rem; opacity: 1; }
    }

    /* ========== TOGGLE THEME ========== */
    .theme-toggle {
      position: fixed; top: 1rem; right: 1rem;
      background: rgba(255,255,255,0.1);
      border: none; color: white; padding: 0.5rem 1rem;
      border-radius: 20px; cursor: pointer; z-index: 10;
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>

  <!-- Tombol Tema -->
  <button class="theme-toggle" onclick="toggleTheme()">🌓</button>

  <div class="container">
    <!-- Logo SVG HABI STUDIO CODING -->
    <svg class="logo-svg" viewBox="0 0 200 50">
      <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff4e50"/>
          <stop offset="50%" stop-color="#f9d423"/>
          <stop offset="100%" stop-color="#7c4dff"/>
        </linearGradient>
      </defs>
      <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle"
            fill="url(#grad)" font-size="24" font-weight="900" font-family="Segoe UI">
        HABI STUDIO CODING
      </text>
    </svg>

    <!-- Tombol Login -->
    <div id="loginArea">
      <button class="primary" onclick="openLoginModal()">
        🔐 Login GitHub
      </button>
    </div>
    <div id="mainArea" style="display:none;">
      <!-- Tab Navigasi -->
      <div class="tab-buttons">
        <button class="tab-btn active" onclick="switchTab('single')">📄 Single</button>
        <button class="tab-btn" onclick="switchTab('zip')">📦 ZIP</button>
        <button class="tab-btn" onclick="switchTab('editor')">✏️ Editor</button>
        <button class="tab-btn" onclick="switchTab('files')">📂 Files</button>
        <button class="tab-btn" onclick="switchTab('rename')">✏️ Rename</button>
        <button class="tab-btn" onclick="switchTab('create-repo')">➕ Buat Repo</button>
        <button class="tab-btn" onclick="switchTab('list-repo')">📋 Daftar Repo</button>
      </div>

      <!-- Tab Single -->
      <div id="tab-single" class="tab-content active">
        <h3>📄 Single File Upload</h3>
        <!-- Isi sesuai versi sebelumnya -->
      </div>

      <!-- Tab ZIP -->
      <div id="tab-zip" class="tab-content">
        <h3>📦 Upload ZIP</h3>
        <input type="file" id="zipFile" accept=".zip">
        <label><input type="checkbox" id="stripRoot" checked> Hapus folder root</label>
        <button class="primary" onclick="deployZip()">📤 Upload ZIP & Deploy</button>
        <div id="zipProgress" style="margin-top:0.5rem;"></div>
      </div>

      <!-- Tab Daftar Repo (contoh rapi) -->
      <div id="tab-list-repo" class="tab-content">
        <h3>📋 Daftar Repo</h3>
        <button onclick="refreshRepoList()" class="primary" style="width:auto;">🔄 Refresh</button>
        <div id="repoListContainer" style="max-height:300px; overflow-y:auto; margin:0.5rem 0;"></div>
        <button class="primary danger-btn" onclick="deleteSelectedRepos()">🗑️ Hapus Terpilih</button>
        <div id="deleteHistoryContainer" style="margin-top:1rem;"></div>
      </div>

      <!-- Status -->
      <div id="globalStatus" style="margin-top:1rem;"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer style="text-align:center; margin-top:2rem; opacity:0.7;">
    <div style="display:flex; justify-content:center; gap:1rem; flex-wrap:wrap; margin-bottom:1rem;">
      <a href="https://github.com/habigeneratewebsite-a11y/deploy-tool" target="_blank">GitHub</a>
      <a href="https://code-zipper-tool--linamayasari816.replit.app/chat-to-zip/" target="_blank">Chat-to-ZIP</a>
      <label>Mode Anti-Lag <input type="checkbox" id="antiLagToggle" checked onchange="toggleAntiLag()"></label>
    </div>
    Powered by <strong>HABI STUDIO AI</strong> — Melampaui Batas Kreativitas
  </footer>

  <!-- Modal Login -->
  <div id="loginModal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <h3>🔐 Login GitHub</h3>
      <p style="font-size:0.8rem; margin-bottom:1rem;">Masukkan Personal Access Token untuk mengakses tool ini.</p>
      <input type="text" id="loginUsername" placeholder="Username GitHub">
      <input type="text" id="loginRepo" placeholder="Repository default">
      <input type="password" id="loginToken" placeholder="ghp_xxxx">
      <small><a href="https://github.com/settings/tokens/new?scopes=repo,delete_repo" target="_blank">Buat token di sini</a></small>
      <button class="primary" onclick="doLogin()" style="margin-top:1rem;">Login & Simpan</button>
      <button onclick="closeLoginModal()" style="background:none; border:none; color:#aaa; margin-top:0.5rem;">Batal</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" style="display:none;"></div>

  <script>
    // ========== GLOBAL STATE ==========
    let repoTree = [];
    let loggedIn = false;

    window.onload = () => {
      const creds = JSON.parse(localStorage.getItem('habistudio_creds') || '{}');
      if (creds.token) {
        loggedIn = true;
        document.getElementById('loginArea').style.display = 'none';
        document.getElementById('mainArea').style.display = 'block';
        switchTab('single');
      }
    };

    // ========== LOGIN ==========
    function openLoginModal() {
      document.getElementById('loginModal').style.display = 'flex';
    }
    function closeLoginModal() {
      document.getElementById('loginModal').style.display = 'none';
    }
    function doLogin() {
      const u = document.getElementById('loginUsername').value.trim();
      const r = document.getElementById('loginRepo').value.trim();
      const t = document.getElementById('loginToken').value.trim();
      if (!u || !t) { showToast('Isi username dan token!'); return; }
      const creds = { username: u, repo: r || '', token: t };
      localStorage.setItem('habistudio_creds', JSON.stringify(creds));
      closeLoginModal();
      loggedIn = true;
      document.getElementById('loginArea').style.display = 'none';
      document.getElementById('mainArea').style.display = 'block';
      showToast('✅ Login berhasil! Selamat datang, ' + u);
      switchTab('single');
    }

    // ========== TOAST ==========
    function showToast(msg, duration=2500) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', duration);
    }

    // ========== TABS ==========
    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      const el = document.getElementById('tab-' + tab);
      if (el) el.classList.add('active');
      const btn = Array.from(document.querySelectorAll('.tab-btn')).find(b => b.textContent.includes(tab === 'single' ? 'Single' : tab === 'zip' ? 'ZIP' : tab === 'editor' ? 'Editor' : tab === 'files' ? 'Files' : tab === 'rename' ? 'Rename' : tab === 'create-repo' ? 'Buat Repo' : 'Daftar Repo'));
      if (btn) btn.classList.add('active');
      if (tab === 'list-repo') refreshRepoList();
    }

    // ========== DAFTAR REPO ==========
    function getCreds() {
      return JSON.parse(localStorage.getItem('habistudio_creds') || '{}');
    }

    async function refreshRepoList() {
      const c = getCreds();
      if (!c.token) { showToast('Login dulu!'); return; }
      try {
        const res = await fetch('https://api.github.com/user/repos?per_page=100', {
          headers: { 'Authorization': 'token ' + c.token }
        });
        if (!res.ok) throw new Error('Gagal fetch');
        const repos = await res.json();
        renderRepoList(repos);
      } catch(e) {
        showToast('Gagal: ' + e.message);
      }
    }

    function renderRepoList(repos) {
      const container = document.getElementById('repoListContainer');
      let html = '';
      repos.forEach(repo => {
        const prot = repo.name === 'deploy-tool';
        html += `<div class="repo-list-item">
          ${prot ? '🔒' : '<input type="checkbox" class="repo-checkbox" value="' + repo.name + '" data-owner="' + repo.owner.login + '">'}
          <span class="repo-name" onclick="copyRepoName('${repo.name}')">${repo.name}</span>
          ${prot ? '<span style="background:#e53935; padding:2px 8px; border-radius:8px; font-size:0.7rem;">DILINDUNGI</span>' : ''}
        </div>`;
      });
      container.innerHTML = html || '<p>Tidak ada repo.</p>';
    }

    function copyRepoName(name) {
      navigator.clipboard.writeText(name).then(() => showToast('📋 Nama repo disalin!'));
    }

    async function deleteSelectedRepos() {
      const boxes = document.querySelectorAll('.repo-checkbox:checked');
      if (boxes.length === 0) { showToast('Pilih repo dulu.'); return; }
      const c = getCreds();
      for (const box of boxes) {
        try {
          await fetch(`https://api.github.com/repos/${box.dataset.owner}/${box.value}`, {
            method: 'DELETE',
            headers: { 'Authorization': 'token ' + c.token }
          });
        } catch(e) {}
      }
      showToast('✅ Repo terpilih dihapus.');
      refreshRepoList();
    }

    // ========== ZIP UPLOAD (contoh progress) ==========
    async function deployZip() {
      const c = getCreds();
      const fileInput = document.getElementById('zipFile');
      if (!fileInput.files.length) { showToast('Pilih file ZIP.'); return; }
      const zip = await JSZip.loadAsync(fileInput.files[0]);
      const files = [];
      zip.forEach((path, f) => { if (!f.dir) files.push({ path, data: f.async('string') }); });
      const strip = document.getElementById('stripRoot').checked;
      let paths = files.map(f => f.path);
      if (strip && paths.length > 0) {
        const root = paths[0].split('/')[0];
        if (paths.every(p => p.startsWith(root + '/'))) {
          files.forEach(f => f.path = f.path.replace(root + '/', ''));
        }
      }
      let done = 0;
      const progress = document.getElementById('zipProgress');
      for (const f of files) {
        const content = await f.data;
        // upload logic here (call githubUpload)
        done++;
        progress.textContent = `Upload ${done}/${files.length}...`;
      }
      showToast('✅ ZIP berhasil diupload!');
      progress.textContent = '';
    }

    // ========== THEME ==========
    function toggleTheme() {
      document.body.classList.toggle('light');
    }

    // ========== ANTI LAG ==========
    function toggleAntiLag() {
      const p = document.getElementById('particles');
      p.style.display = document.getElementById('antiLagToggle').checked ? 'none' : 'block';
    }

    // ========== BACKGROUND PARTICLES ==========
    (function() {
      const container = document.getElementById('particles');
      for (let i=0;i<25;i++) {
        const p = document.createElement('div');
        p.style.cssText = 'position:absolute; background:rgba(255,255,255,0.1); border-radius:50%; animation: float linear infinite;';
        p.style.width = Math.random()*6+3+'px';
        p.style.height = p.style.width;
        p.style.left = Math.random()*100+'%';
        p.style.animationDuration = Math.random()*12+8+'s';
        p.style.animationDelay = Math.random()*8+'s';
        container.appendChild(p);
      }
    })();
  </script>
</body>
</html>
